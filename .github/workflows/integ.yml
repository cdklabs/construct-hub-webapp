name: integ
on:
  workflow_dispatch: {}
  pull_request: {}
  merge_group: {}
jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Cypress Run
        id: cypress_run
        uses: cypress-io/github-action@v6
        env:
          DEBUG: "@cypress/github-action"
        with:
          start: yarn proxy-server:ci
          wait-on: http://localhost:3000
          wait-on-timeout: 150
      - id: auto_9c943d99
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      - id: auto_9c943d99_2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
